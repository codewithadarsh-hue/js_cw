<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
</head>
<body>
    <script>
        // User class
        class User {
            constructor(name, age, email) {
                this.name = name;
                this.age = age;
                this.email = email;
            }

            // Getter for name
            get getName() {
                return this.name;
            }

            // Getter for age   
            get getAge() {
                return this.age;
            }

            // Getter for email
            get getEmail() {
                return this.email;
            }

            // Setter for email
            set setEmail(newEmail) {
                if (newEmail.includes("@")) {
                    this.email = newEmail;
                    console.log("Email updated successfully.");
                } else {
                    console.log("Invalid email! Email not updated.");
                }
            }
        }

        // Create an object
        const user1 = new User("Adarsh", 21, "adarsh@example.com");

        // Display initial details
        console.log("Initial User Details:");
        console.log("Name:", user1.getName);
        console.log("Age:", user1.getAge);
        console.log("Email:", user1.getEmail);

        // Update email with a valid email
        user1.setEmail = "adarsh123@gmail.com";

        // Try updating email with an invalid email
        user1.setEmail = "adarsh123gmail.com";

        // Display final details
        console.log("\nFinal User Details:");
        console.log("Name:", user1.getName);
        console.log("Age:", user1.getAge);
        console.log("Email:", user1.getEmail);

    </script>
</body>
</html>
