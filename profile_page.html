<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

  <button onclick="myFunction()">Submit</button>
  <p id="demo"></p>
  <p id="demo1"></p>


    <script>

        let userName = "Adarsh";
        let age = 20;
        let isAdmin = true;

        let user = {
            name: userName,
            age: age,
            admin: isAdmin
        };

        function myFunction() {
            var access= (user.age >= 18 && user.admin) ? "Access Granted":"Access Denied";
            var checkAge = ("age" in user) ? "Age property exists":"Age property does not exist";
            delete user.age;
            document.getElementById("demo").innerHTML = access;
            document.getElementById("demo1").innerHTML = checkAge;

        }
    </script>
</body>
</html>
