<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday  tool</title>
</head>
<body>
    <p id="demo"></p>   

    <script>
        let friend = {name: "Saran", birthDate: "2004-08-15"};

        function getBirthdayDetails(friend) {  
            let birthday = new Date(friend.birthDate);
            let months = ["January", "February", "March", "April","May", "June", "July", "August",
                        "September", "October", "November", "December"
                    ];
            
            let day = birthday.getDate();
            let month = months[birthday.getMonth()];
            let year = birthday.getFullYear();

            let today = new Date();
            let age = today.getFullYear() - birthday.getFullYear();

            if (
                today.getMonth() < birthday.getMonth() ||
                (today.getMonth() === birthday.getMonth() &&
                today.getDate() < birthday.getDate())
             ) {
                age--;
            }

            document.getElementById("demo").innerHTML = friend.name + " was born on " +
            day + " " + month + ", " + year +" and is " + age + " years old.";
        }
        getBirthdayDetails(friend);
        
    </script>
</body>
</html>
