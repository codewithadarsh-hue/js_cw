<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Checker</title>
</head>
<body>

    <input type="text" id="input"
    value="My son is 12 years old. Our flat number is 45 and contact is 9876543210.">

    <button onclick="myFunction()">Check Comment</button>

    <p id="demo"></p>

    <script>

        function myFunction(){

            let comment = document.getElementById("input").value;

            // Check if the comment contains any digits
            let hasNumbers = /\d/.test(comment);

            // Replace all numbers with "NUMBER"
            let updatedComment = comment.replace(/\d+/g, "NUMBER");

            let result =
            "Number Found: " + hasNumbers + "<br><br>" +
            "Updated Comment: " + updatedComment;

            document.getElementById("demo").innerHTML = result;

        }

    </script>

</body>
</html>
